plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.23'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: minecraft_version
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Modrinth dependencies
    // Re:Avaritia (project QeB3NRC5)
    implementation fg.deobf("maven.modrinth:QeB3NRC5:ssUn2Txe")
    // Ars Nouveau (project TKB6INcv)
    implementation fg.deobf("maven.modrinth:TKB6INcv:Hw2aD01e")
    // Botania (project pfjLUfGv)
    implementation fg.deobf("maven.modrinth:pfjLUfGv:Y3Gc88UV")
    // Blood Magic (project PbNc6qBY)
    implementation fg.deobf("maven.modrinth:PbNc6qBY:1YxwR16I")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
}

// Ensure ${} placeholders in mods.toml / pack.mcmeta are replaced at build time
processResources {
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand project.properties
    }
}
